name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Format
        run: cargo fmt --check
        working-directory: rust
      - name: Clippy
        run: cargo clippy -- -D warnings
        working-directory: rust
      - name: Test
        run: cargo test
        working-directory: rust

  flutter:
    name: Flutter (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build: flutter build linux --debug
          - os: macos-latest
            build: flutter build macos --debug
          - os: windows-latest
            build: flutter build windows --debug
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build (compiles Rust core via cargokit)
        run: ${{ matrix.build }}

      # A Windows build that links is not the same as one that starts: a
      # missing sibling DLL or an assets path the engine cannot resolve both
      # fail at launch, not at link time, and neither shows up in any other
      # job. Launch from an unrelated working directory, because that is how
      # the app is started once winget puts its install directory on PATH.
      - name: Smoke test the Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-ChildItem -Recurse -Filter 'clean-mind.exe' `
            -Path 'build\windows' | Select-Object -First 1
          if (-not $exe) {
            throw 'clean-mind.exe was not produced (did BINARY_NAME change?)'
          }
          Write-Host "Launching $($exe.FullName) with CWD C:\"

          $p = Start-Process -FilePath $exe.FullName -WorkingDirectory 'C:\' -PassThru
          Start-Sleep -Seconds 15

          if ($p.HasExited) {
            $code = '0x{0:X8}' -f $p.ExitCode
            if ($p.ExitCode -eq 0xC0000135) {
              throw "Exited $code (STATUS_DLL_NOT_FOUND): a DLL the exe imports is missing from the build output."
            }
            throw "Exited $code within 15s; a healthy GUI build stays running."
          }

          Write-Host 'Still running after 15s.'
          Stop-Process -Id $p.Id -Force

  integration:
    name: Integration tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev xvfb
      - run: flutter pub get
      # screenshot_test.dart is a visual-review capture tool (no assertions,
      # documented for `-d macos`), not a CI check, so only app_test.dart
      # runs here. flutter test excludes integration_test/ by default, so
      # this is the only place these run.
      - name: Integration test (compiles Rust core via cargokit)
        run: xvfb-run -a flutter test integration_test/app_test.dart -d linux
