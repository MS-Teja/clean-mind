# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.9.0.schema.json
PackageIdentifier: MS-Teja.CleanMind
PackageVersion: 1.2.3
Platform:
  - Windows.Desktop
InstallerType: zip
NestedInstallerType: portable
# clean-mind.exe has load-time imports on flutter_windows.dll, the plugin DLLs
# and the bundled VC++ runtime, all of which sit beside it in the archive. The
# default portable behaviour puts a symlink in winget's Links folder and starts
# the app from there, where the loader cannot find any of them, so the process
# dies with STATUS_DLL_NOT_FOUND before reaching main. Setting this to true
# skips the symlink and puts the real install directory on PATH instead, so
# every sibling DLL resolves. Requires manifest schema >= 1.9.0.
ArchiveBinariesDependOnPath: true
NestedInstallerFiles:
  # No PortableCommandAlias: the mode above creates no symlink, so an alias
  # would be ignored. The command on PATH is the file name, `clean-mind`.
  - RelativeFilePath: clean-mind.exe
Installers:
  - Architecture: x64
    InstallerUrl: https://github.com/MS-Teja/clean-mind/releases/download/v1.2.3/CleanMind-1.2.3-windows-x64.zip
    InstallerSha256: EF5EF1EA4D44CBA4FCB6AF59E40D792CC6CF58E70054F88F11A827CCF8F7BBFF
  - Architecture: arm64
    InstallerUrl: https://github.com/MS-Teja/clean-mind/releases/download/v1.2.3/CleanMind-1.2.3-windows-arm64.zip
    InstallerSha256: 7A781A9114C4E236BA391D7F4889B9002E5644F1B5DF556F5106F14BDE923D66
ManifestType: installer
ManifestVersion: 1.9.0
